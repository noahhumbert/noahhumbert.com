<VirtualHost *:80>
    # Server Config
    ServerAdmin webmaster@localhost
    ServerName website.noahhumbert.com

    # Configure the document root to make sure all other files aren't publicly accessible
    DocumentRoot /var/www/noahhumbert.com/public

    # Configure Directory Permissions
    <Directory /var/www/noahhumbert.com/public>
        AllowOverride All
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Set the index
    DirectoryIndex index.php

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/error.og
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>